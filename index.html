    <!-- Custom CSS Configuration and Keyframes -->
    <style>
        /* Base styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e6f0fa; /* Soft light blue/very light denim */
            overflow-x: hidden;
            position: relative;
        }

        /* Animations */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @keyframes float-reverse {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .floating-element {
            position: fixed;
            z-index: -1;
            opacity: 0.15;
            color: #64748b;
        }

        /* Ripple Effect */
        .btn-interactive {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-interactive:active {
            transform: scale(0.98);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            background-color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }

        .ripple-dark {
            background-color: rgba(0, 0, 0, 0.1);
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Glassmorphism Soft Borders */
        .glass-border {
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        /* Interactive Element Mini Animations on Hover */
        .btn-interactive:hover .icon-left {
            transform: translateY(-2px) scale(1.05);
            transition: transform 0.3s ease;
        }
        .btn-interactive:hover .icon-right {
            transform: scale(1.1) rotate(3deg);
            transition: transform 0.3s ease;
        }
    </style>
</head>

    <!-- Javascript for Interactivity -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Function to handle the ripple effect on click
            function createRipple(event) {
                const button = event.currentTarget;
                
                // Remove existing ripples
                const existingRipples = button.querySelectorAll('.ripple');
                existingRipples.forEach(r => r.remove());

                const circle = document.createElement("span");
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                // Get exact click coordinates relative to the button
                const rect = button.getBoundingClientRect();
                
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${event.clientX - rect.left - radius}px`;
                circle.style.top = `${event.clientY - rect.top - radius}px`;
                
                circle.classList.add("ripple");
                
                // Add specific logic if the button is dark colored to make ripple visible
                if (button.classList.contains('bg-slate-800')) {
                    circle.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                }

                button.appendChild(circle);

                // Simulation of Navigation (Optional: to demonstrate what happens next)
                setTimeout(() => {
                    const buttonText = button.querySelector('span').innerText;
                    console.log(`Navigasi ke: ${buttonText}`);
                    // window.location.href = '#'; // This is where actual routing happens
                }, 400); 
            }

            // Apply event listener to all interactive buttons
            const buttons = document.querySelectorAll('.btn-interactive');
            buttons.forEach(button => {
                button.addEventListener('mousedown', createRipple);
                // For touch devices
                button.addEventListener('touchstart', (e) => {
                    // pass the first touch point to the ripple creator
                    const touch = e.touches[0];
                    const fakeEvent = {
                        currentTarget: button,
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    };
                    createRipple(fakeEvent);
                }, {passive: true});
            });
        });
    </script>
